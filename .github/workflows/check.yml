# Media-free checks on every PR and on main. No secrets, no renders, no footage.
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
  checks:
    # Windows, like the pipeline: scripts run `node node_modules/esbuild/bin/esbuild`, which is a native binary on Linux.
    runs-on: windows-latest
    # Checks bundle into scripts/tmp-dir.mjs (node_modules/.cache/finhub-tmp), so `remotion`
    # resolves on any OS. TEMP/TMP stay inside the workspace for anything else that writes there.
    env:
      TEMP: ${{ github.workspace }}\.ci-tmp
      TMP: ${{ github.workspace }}\.ci-tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: New-Item -ItemType Directory -Force .ci-tmp
      # check-speech-cuts.selftest synthesizes a tone with ffmpeg (no footage needed).
      - run: choco install ffmpeg --no-progress -y
      # check-schema's browser on a GPU-less runner: swangle = --use-gl=angle --use-angle=swiftshader
      # (@remotion/renderer 4.0.527 dist/options/gl.js:7, dist/open-browser.js:40-41).
      - run: npm test
        env: { FINHUB_GL: swangle }
      # A diagnostic, never a failure: check-schema on a media-free fixture with the browser's own
      # stderr (verbose), so a "Target closed" shows why the browser went.
      - name: check-schema probe (verbose)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10 # a hung browser must not hold the job to GitHub's 360-minute limit
        shell: bash
        env: { FINHUB_GL: swangle, FINHUB_SCHEMA_LOG: verbose }
        run: node scripts/check-schema.mjs _test-schema-probe --public-dir scripts/fixtures/schema-probe
      # Stdlib-only Python checks (no packages, no media). Kept out of `npm test` so that stays Node-only.
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: python checks
        shell: bash
        run: |
          python scripts/check-clips.py
          python scripts/check-migrate-assets.py
          python scripts/check-reframe.py
          python scripts/check-render-video.py
          python scripts/research.py selftest
          python scripts/omnivoice-tts.py selftest
