# Media-free checks on every PR and on main. No secrets, no renders, no footage.
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
  checks:
    # Windows, like the pipeline: scripts run `node node_modules/esbuild/bin/esbuild`, which is a native binary on Linux.
    runs-on: windows-latest
    # Checks bundle into os.tmpdir() and import `remotion` from there. On Daniel's machine a
    # C:\Users\Daniel\node_modules above the temp dir makes that resolve; here the temp dir
    # sits inside the workspace so it resolves to the repo's node_modules.
    env:
      TEMP: ${{ github.workspace }}\.ci-tmp
      TMP: ${{ github.workspace }}\.ci-tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: New-Item -ItemType Directory -Force .ci-tmp
      - run: npm test
